<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCEAN COMPASS</title>
    <style>
        /* --- 全体のスタイル（深海グラデーション） --- */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #4cc9f0 0%, #4361ee 100%);
            min-height: 100vh;
            color: #ffffff;
            box-sizing: border-box;
            padding-bottom: 110px;
        }
        input:focus, select:focus, textarea:focus { outline: none; }
        
        /* --- グラスモーフィズム（ガラス調カード） --- */
        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        /* 画面全体のコンテナ */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        /* タブの表示・非表示制御 */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ナビゲーションバー */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 85px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            z-index: 90;
        }
        nav button {
            flex: 1;
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.2s, transform 0.2s;
        }
        nav button.active {
            opacity: 1;
            transform: scale(1.1);
        }
        nav button.home-btn { font-size: 2.2rem; }

        /* ボタン */
        .btn-main {
            width: 100%;
            background: #ff9e00;
            border: none;
            color: #fff;
            border-radius: 18px;
            font-weight: bold;
            height: 60px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #cc7e00;
        }
        .btn-main:active { transform: translateY(2px); box-shadow: 0 2px 0 #cc7e00; }

        /* スケジュールテーブル */
        table { width: 100%; font-size: 0.8rem; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
        th, td { border: 1px solid rgba(255, 255, 255, 0.3); padding: 8px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        th { background: rgba(255, 255, 255, 0.15); font-weight: bold; }
        td { background: rgba(255, 255, 255, 0.05); }
        
        /* 単語帳のモザイク */
        .blur-text {
            filter: blur(6px);
            cursor: pointer;
            background: rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 8px;
            transition: filter 0.15s, background 0.15s;
        }
        .blur-text.reveal { filter: none; background: transparent; }

        /* タイマー設定 */
        .timer-settings { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        .timer-select, .timer-input { padding: 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.2); color: #fff; border: 1px solid rgba(255, 255, 255, 0.4); font-size: 0.9rem; }
        .timer-select option { color: #333; }
        .timer-input { width: 60px; text-align: center; }

        /* 設定画面の時間割入力 */
        .setting-grid-row { display: flex; gap: 5px; margin-bottom: 5px; }
        .setting-grid-input { flex: 1; width: 100%; min-width: 0; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 6px 4px; border-radius: 6px; font-size: 0.75rem; text-align: center; box-sizing: border-box; }

        /* 入力フォーム */
        .word-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .word-input-row { display: flex; gap: 8px; align-items: center; }
        .word-field { flex: 1; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 10px 12px; border-radius: 12px; font-size: 0.9rem; box-sizing: border-box; }
        .word-field::placeholder { color: rgba(255,255,255,0.6); }
        .btn-action { background: #3a0ca3; color: #fff; border: none; padding: 10px 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.85rem; white-space: nowrap; box-shadow: 0 3px 0 #240046; }
        .btn-action:active { transform: translateY(1px); box-shadow: 0 2px 0 #240046; }
        .btn-add { background: #ff9e00; color: #fff; border: none; padding: 10px 18px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.9rem; box-shadow: 0 3px 0 #cc7e00; }
        .btn-add:active { transform: translateY(1px); box-shadow: 0 2px 0 #cc7e00; }

        .control-btns { display: flex; gap: 8px; margin-bottom: 15px; justify-content: space-between; }
        .btn-ctrl { flex: 1; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 4px; border-radius: 10px; font-size: 0.7rem; cursor: pointer; font-weight: bold; }

        /* クイックToDo追加フォーム（ホーム用） */
        .quick-input-box {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            animation: slideDown 0.2s ease-out forwards;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 締め切り日入力欄のカスタム */
        .date-field {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            color-scheme: dark; /* カレンダーのポップアップをダークモード対応に */
        }
    </style>
</head>
<body>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div style="width: 45px; height: 45px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">🧑‍💻</div>
            <div style="text-align: center;">
                <div style="font-weight: 900; letter-spacing: 3px;">OCEAN COMPASS</div>
                <div style="font-size: 0.65rem; background: rgba(0,0,0,0.15); padding: 2px 8px; border-radius: 10px; margin-top: 3px;">ID: D-7732 ⚓️ DIVER_01</div>
            </div>
            <span style="font-size: 1.2rem;">🐠</span>
        </div>

        <div id="tab-home" class="tab-content active">
            <div class="card">
                <div style="font-size: 0.8rem; margin-bottom: 12px; opacity: 0.8;">今週の潜水記録（分）</div>
                <div style="display: flex; align-items: flex-end; justify-content: space-around; height: 80px; gap: 8px;">
                    <div style="flex:1; text-align:center;"><div style="background:#fff; height:20px; border-radius:4px; opacity:0.6;"></div><span style="font-size:0.6rem;">月</span></div>
                    <div style="flex:1; text-align:center;"><div style="background:#fff; height:45px; border-radius:4px; opacity:0.6;"></div><span style="font-size:0.6rem;">火</span></div>
                    <div style="flex:1; text-align:center;"><div style="background:#fff; height:30px; border-radius:4px; opacity:0.6;"></div><span style="font-size:0.6rem;">水</span></div>
                    <div style="flex:1; text-align:center;"><div style="background:#fff; height:60px; border-radius:4px; opacity:0.6;"></div><span style="font-size:0.6rem;">木</span></div>
                    <div style="flex:1; text-align:center;"><div style="background:#ff9e00; height:75px; border-radius:4px;"></div><span style="font-size:0.6rem; font-weight:bold;">金</span></div>
                    <div style="flex:1; text-align:center;"><div style="background:#fff; height:10px; border-radius:4px; opacity:0.6;"></div><span style="font-size:0.6rem;">土</span></div>
                    <div style="flex:1; text-align:center;"><div style="background:#fff; height:5px; border-radius:4px; opacity:0.6;"></div><span style="font-size:0.6rem;">日</span></div>
                </div>
            </div>

            <div class="card" style="background: rgba(0,0,0,0.1); padding: 25px 20px; margin-bottom: 15px;">
                <div class="timer-settings" id="timer-settings-box">
                    <select class="timer-select" id="timer-mode-select" onchange="changeTimerMode()" style="flex: 1;">
                        <option value="countdown">カウントダウン</option>
                        <option value="countup">カウントアップ</option>
                    </select>
                    <div id="countdown-input-wrapper" style="display: flex; align-items: center; gap: 5px;">
                        <input type="number" class="timer-input" id="timer-minutes-input" value="25" min="1" max="999" oninput="updateMinutes()">
                        <span>分</span>
                    </div>
                </div>

                <div style="text-align: center;">
                    <div style="font-size: 3.5rem; font-weight: 100; margin-bottom: 5px;" id="timer-display">25:00</div>
                    <div style="font-size: 0.7rem; opacity: 0.6; margin-bottom: 20px; letter-spacing: 2px;" id="timer-status-label">FOCUS TIMER</div>
                    <button class="btn-main" onclick="toggleTimer()" id="sync-btn">潜水開始</button>
                </div>
            </div>

            <div class="card" style="padding: 15px 20px;">
                <div style="display: flex; gap: 10px;">
                    <button class="btn-action" onclick="toggleQuickTodoInput()" style="flex: 1; background: rgba(255,255,255,0.15); box-shadow: none; height: 45px; border-radius: 14px; font-size: 0.9rem;">＋ クイックToDo</button>
                    <button class="btn-action" style="flex: 1; background: #ffffff; color: #3a0ca3; box-shadow: none; height: 45px; border-radius: 14px; font-size: 0.9rem;">🧠 AI振り返り</button>
                </div>

                <div class="quick-input-box" id="quick-todo-form">
                    <div style="font-size: 0.75rem; opacity: 0.8; font-weight: bold; margin-top: 5px;">🫧 新しいミッションを登録</div>
                    <input type="text" id="input-home-todo" class="word-field" placeholder="ミッションを入力..." style="height: 40px; border-radius: 10px;">
                    
                    <div style="display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.1); padding: 8px 12px; border-radius: 10px;">
                        <span style="font-size: 0.75rem; opacity: 0.8;">⏳ 締め切り設定 (任意):</span>
                        <input type="date" id="input-todo-deadline" class="date-field" style="flex: 1; height: 30px;">
                    </div>

                    <button class="btn-add" onclick="addHomeTodo()" style="height: 40px; padding: 0 15px; border-radius: 10px; font-size: 0.85rem; width: 100%;">ミッションを発動する 🚀</button>
                </div>
            </div>
        </div>

        <div id="tab-schedule" class="tab-content">
            <h2 style="font-size: 1.2rem; margin-bottom: 15px;">スケジュール & ミッション</h2>
            
            <div class="card" style="padding: 18px 20px;">
                <div style="font-size: 0.85rem; margin-bottom: 15px; opacity: 0.8; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
                    <span>⚓️ 現在のミッション一覧（ToDo）</span>
                    <span id="todo-count-badge" style="background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px; font-size: 0.7rem;">0</span>
                </div>
                
                <div id="schedule-todo-list-container">
                    </div>
            </div>
            
            <div class="card" style="overflow-x: auto; padding: 15px 10px;">
                <div style="font-size: 0.8rem; margin-bottom: 8px; opacity: 0.8; font-weight: bold;">⚓️ 週間潜水プラン（時間割）</div>
                <table>
                    <thead>
                        <tr>
                            <th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th>
                        </tr>
                    </thead>
                    <tbody id="timetable-body">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="tab-word" class="tab-content">
            <h2 style="font-size: 1.2rem; margin-bottom: 15px;">深海単語帳</h2>
            
            <div class="card">
                <div style="font-size: 0.8rem; margin-bottom: 10px; opacity: 0.8; font-weight: bold;">🫧 新しい単語を追加</div>
                <div class="word-form">
                    <div class="word-input-row">
                        <input type="text" id="input-en" class="word-field" placeholder="英語 (例: Ocean)">
                        <button class="btn-action" onclick="askVercelAiTranslate()" id="btn-ai-translate">AI翻訳 🧠</button>
                    </div>
                    <div class="word-input-row">
                        <input type="text" id="input-ja" class="word-field" placeholder="日本語訳（AIが自動生成します）">
                        <button class="btn-add" onclick="addNewWord()">追加</button>
                    </div>
                    <div id="ai-status-tips" style="font-size: 0.7rem; color: #ff9e00; display: none; padding-left: 5px; font-weight: bold;"></div>
                </div>
            </div>

            <div class="control-btns">
                <button class="btn-ctrl" onclick="setGlobalVisibility('hide-ja')">🇯🇵 訳を全隠し</button>
                <button class="btn-ctrl" onclick="setGlobalVisibility('hide-en')">🇺🇸 英を全隠し</button>
                <button class="btn-ctrl" onclick="setGlobalVisibility('reveal-all')">👁️ 全て表示</button>
            </div>

            <div id="word-list-container"></div>
        </div>

        <div id="tab-friends" class="tab-content">
            <h2 style="font-size: 1.2rem; margin-bottom: 5px;">探索チーム</h2>
            <p style="font-size: 0.75rem; opacity: 0.8; margin-bottom: 15px;">※スタンドアロン（オフライン）稼働中</p>
            <div class="card" style="display: flex; align-items: center; gap: 15px;">
                <div style="width:45px; height:45px; background:rgba(255,255,255,0.3); border-radius:50%; display:flex; align-items:center; justify-content:center;">🐳</div>
                <div style="flex: 1;">
                    <div style="font-weight: bold;">TAKUYA</div>
                    <div style="font-size: 0.7rem; opacity:0.7;">ID: D-4432 |深度: 45m</div>
                </div>
                <span style="color: #4ade80; font-size: 0.8rem;">● 潜水中</span>
            </div>
        </div>

        <div id="tab-settings" class="tab-content">
            <h2 style="font-size: 1.2rem; margin-bottom: 15px;">システム設定</h2>
            <div class="card">
                <label style="font-size: 0.8rem; opacity: 0.8; display: block; margin-bottom: 5px;">ダイバーネーム</label>
                <input type="text" value="DIVER_01" style="width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 10px; border-radius: 8px; font-size: 1rem; box-sizing: border-box;">
            </div>

            <div class="card">
                <label style="font-size: 0.8rem; opacity: 0.8; display: block; margin-bottom: 10px; font-weight: bold;">📅 時間割の設定 (7時間×7日)</label>
                <div id="timetable-editor-box"></div>
            </div>
        </div>
    </div>

    <nav>
        <button onclick="switchTab('word', this)">🎴</button>
        <button onclick="switchTab('schedule', this)">📅</button>
        <button onclick="switchTab('home', this)" class="home-btn active">⚓</button>
        <button onclick="switchTab('friends', this)">👥</button>
        <button onclick="switchTab('settings', this)">⚙️</button>
    </nav>

    <script>
        function switchTab(tabId, button) {
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.classList.remove('active'));
            const buttons = document.querySelectorAll('nav button');
            buttons.forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            button.classList.add('active');
        }

        // --- タイマーシステム ---
        let timer = null;
        let isRunning = false;
        let currentMode = localStorage.getItem('ocean_timer_mode') || 'countdown';
        let savedMinutes = parseInt(localStorage.getItem('ocean_timer_minutes')) || 25;
        let secondsElapsed = 0;
        let secondsRemaining = savedMinutes * 60;

        document.getElementById('timer-mode-select').value = currentMode;
        document.getElementById('timer-minutes-input').value = savedMinutes;
        applyInitialDisplay();

        function changeTimerMode() {
            if (isRunning) return;
            currentMode = document.getElementById('timer-mode-select').value;
            localStorage.setItem('ocean_timer_mode', currentMode);
            document.getElementById('countdown-input-wrapper').style.display = (currentMode === 'countdown') ? 'flex' : 'none';
            resetTimerState();
        }

        function updateMinutes() {
            if (isRunning) return;
            let val = parseInt(document.getElementById('timer-minutes-input').value);
            if (isNaN(val) || val < 1) val = 1;
            savedMinutes = val;
            localStorage.setItem('ocean_timer_minutes', savedMinutes);
            resetTimerState();
        }

        function resetTimerState() {
            secondsElapsed = 0;
            secondsRemaining = savedMinutes * 60;
            const display = document.getElementById('timer-display');
            const label = document.getElementById('timer-status-label');
            if (currentMode === 'countdown') {
                display.innerText = formatTime(secondsRemaining);
                label.innerText = "TIME REMAINING";
            } else {
                display.innerText = "00:00";
                label.innerText = "TIME ELAPSED";
            }
        }

        function applyInitialDisplay() {
            document.getElementById('countdown-input-wrapper').style.display = (currentMode === 'countdown') ? 'flex' : 'none';
            resetTimerState();
        }

        function formatTime(totalSeconds) {
            let m = Math.floor(totalSeconds / 60);
            let s = totalSeconds % 60;
            return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
        }

        function toggleTimer() {
            const btn = document.getElementById('sync-btn');
            const display = document.getElementById('timer-display');
            const settingsBox = document.getElementById('timer-settings-box');
            
            if (isRunning) {
                clearInterval(timer);
                isRunning = false;
                btn.innerText = "潜水開始";
                btn.style.background = "#ff9e00";
                settingsBox.style.opacity = "1";
                settingsBox.style.pointerEvents = "auto";
                resetTimerState();
            } else {
                isRunning = true;
                btn.innerText = "浮上する";
                btn.style.background = "rgba(255,255,255,0.2)";
                settingsBox.style.opacity = "0.4";
                settingsBox.style.pointerEvents = "none";
                
                timer = setInterval(() => {
                    if (currentMode === 'countdown') {
                        secondsRemaining--;
                        display.innerText = formatTime(secondsRemaining);
                        if (secondsRemaining <= 0) {
                            clearInterval(timer);
                            isRunning = false;
                            btn.innerText = "潜水開始";
                            btn.style.background = "#ff9e00";
                            settingsBox.style.opacity = "1";
                            settingsBox.style.pointerEvents = "auto";
                            alert("🎉 ミッション完了！");
                            resetTimerState();
                        }
                    } else {
                        secondsElapsed++;
                        display.innerText = formatTime(secondsElapsed);
                    }
                }, 1000);
            }
        }

        // --- 🐙 【最新版】引っ越し＆締め切り機能付きToDoシステム ---
        const defaultTodos = [
            { id: 1, text: "クジラの生態を調べる", completed: false, deadline: "2026-07-20" },
            { id: 2, text: "単語帳を5個進める", completed: false, deadline: "" }
        ];

        let todos = localStorage.getItem('ocean_todo_list') ? JSON.parse(localStorage.getItem('ocean_todo_list')) : defaultTodos;
        
        // 初回描画
        renderScheduleTodoList();

        // ホーム画面の入力ボックスを開閉
        function toggleQuickTodoInput() {
            const form = document.getElementById('quick-todo-form');
            form.style.display = (form.style.display === 'flex') ? 'none' : 'flex';
            if (form.style.display === 'flex') {
                document.getElementById('input-home-todo').focus();
            }
        }

        // 📅 スケジュール画面側にToDoを描画する関数
        function renderScheduleTodoList() {
            const container = document.getElementById('schedule-todo-list-container');
            const badge = document.getElementById('todo-count-badge');
            if (!container) return; // スケジュール画面がまだ無い時のための安全策

            container.innerHTML = '';

            // 未完了数をバッジに反映
            const incompleteCount = todos.filter(t => !t.completed).length;
            badge.innerText = incompleteCount;

            if (todos.length === 0) {
                container.innerHTML = `<div style="text-align:center; font-size:0.8rem; opacity:0.5; padding:10px;">現在のミッションはすべてクリア！</div>`;
                return;
            }

            todos.forEach(todo => {
                const itemDiv = document.createElement('div');
                itemDiv.style.display = 'flex';
                itemDiv.style.alignItems = 'center';
                itemDiv.style.justifyContent = 'space-between'; // 締め切りを右側に綺麗に並べる
                itemDiv.style.marginBottom = '12px';
                itemDiv.style.transition = 'opacity 0.6s, transform 0.6s';

                // 左側：チェックボックスとテキストのセット
                const leftSide = document.createElement('div');
                leftSide.style.display = 'flex';
                leftSide.style.alignItems = 'center';
                leftSide.style.gap = '10px';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = todo.completed;
                checkbox.style.transform = 'scale(1.2)';
                checkbox.style.cursor = 'pointer';

                const textSpan = document.createElement('span');
                textSpan.innerText = todo.text;
                textSpan.style.fontSize = '0.9rem';
                textSpan.style.transition = 'text-decoration 0.2s, opacity 0.2s';

                if (todo.completed) {
                    textSpan.style.textDecoration = 'line-through';
                    textSpan.style.opacity = '0.4';
                }

                leftSide.appendChild(checkbox);
                leftSide.appendChild(textSpan);
                itemDiv.appendChild(leftSide);

                // 右側：⏳ 締め切りバッジ（登録されている場合だけ表示）
                if (todo.deadline) {
                    const deadlineSpan = document.createElement('span');
                    // 日付フォーマットを「MM/DD」に見やすくパース
                    const dateObj = new Date(todo.deadline);
                    const formattedDate = !isNaN(dateObj) ? `${dateObj.getMonth() + 1}/${dateObj.getDate()}` : todo.deadline;
                    
                    deadlineSpan.innerText = `⏳ ${formattedDate}`;
                    deadlineSpan.style.fontSize = '0.7rem';
                    deadlineSpan.style.background = 'rgba(255, 158, 0, 0.25)';
                    deadlineSpan.style.color = '#ff9e00';
                    deadlineSpan.style.padding = '2px 8px';
                    deadlineSpan.style.borderRadius = '8px';
                    deadlineSpan.style.fontWeight = 'bold';
                    deadlineSpan.style.marginLeft = '10px';
                    deadlineSpan.style.flexShrink = '0';
                    
                    if (todo.completed) deadlineSpan.style.opacity = '0.3';
                    itemDiv.appendChild(deadlineSpan);
                }

                // チェック動作（5分後に消滅）
                checkbox.onchange = function() {
                    todo.completed = checkbox.checked;
                    localStorage.setItem('ocean_todo_list', JSON.stringify(todos));
                    
                    badge.innerText = todos.filter(t => !t.completed).length;

                    if (checkbox.checked) {
                        textSpan.style.textDecoration = 'line-through';
                        textSpan.style.opacity = '0.4';
                        if(itemDiv.lastChild && itemDiv.lastChild !== leftSide) itemDiv.lastChild.style.opacity = '0.3';

                        // 💡【5分後（300,000ミリ秒）に自動消滅】
                        setTimeout(() => {
                            const currentTodo = todos.find(t => t.id === todo.id);
                            if (currentTodo && currentTodo.completed) {
                                itemDiv.style.opacity = '0';
                                itemDiv.style.transform = 'translateX(20px)';
                                
                                setTimeout(() => {
                                    todos = todos.filter(t => t.id !== todo.id);
                                    localStorage.setItem('ocean_todo_list', JSON.stringify(todos));
                                    renderScheduleTodoList();
                                }, 600);
                            }
                        }, 300000); // 5分
                    } else {
                        textSpan.style.textDecoration = 'none';
                        textSpan.style.opacity = '1';
                        if(itemDiv.lastChild && itemDiv.lastChild !== leftSide) itemDiv.lastChild.style.opacity = '1';
                    }
                };

                container.appendChild(itemDiv);
            });
        }

        // ホーム画面から新しいToDo（締め切り付き）を追加する関数
        function addHomeTodo() {
            const input = document.getElementById('input-home-todo');
            const deadlineInput = document.getElementById('input-todo-deadline');
            const val = input.value.trim();
            const deadlineVal = deadlineInput.value; // "YYYY-MM-DD" 形式で取得

            if (!val) return;

            const newTodo = { 
                id: Date.now(), 
                text: val, 
                completed: false,
                deadline: deadlineVal // 締め切り日を保存
            };
            
            todos.push(newTodo);
            localStorage.setItem('ocean_todo_list', JSON.stringify(todos));

            // 入力欄をまっさらにリセット
            input.value = '';
            deadlineInput.value = '';
            document.getElementById('quick-todo-form').style.display = 'none'; // フォームを閉じる
            
            // リストを再描画（スケジュール画面側）
            renderScheduleTodoList();
            
            // 親切心で、追加されたのがわかるようにスケジュールタブへ自動ジャンプ！
            switchTab('schedule', document.querySelectorAll('nav button')[1]);
        }


        // --- 時間割システム ---
        const ROWS = 7, COLS = 7;
        const defaultTimetable = [
            ["邦楽", "英語", "数学", "英語", "プロ", "数学", "休み"],
            ["復習", "国語", "理科", "社会", "英語", "理科", "演習"],
            ["-","-","-","-","-","-","-"],["-","-","-","-","-","-","-"],
            ["-","-","-","-","-","-","-"],["-","-","-","-","-","-","-"],["-","-","-","-","-","-","-"]
        ];
        let timetableData = localStorage.getItem('ocean_timetable_data') ? JSON.parse(localStorage.getItem('ocean_timetable_data')) : defaultTimetable;

        initTimetable();
        function initTimetable() {
            const tableBody = document.getElementById('timetable-body');
            const editorBox = document.getElementById('timetable-editor-box');
            tableBody.innerHTML = ''; editorBox.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                const tr = document.createElement('tr');
                const rowDiv = document.createElement('div'); rowDiv.className = 'setting-grid-row';
                for (let c = 0; c < COLS; c++) {
                    const text = timetableData[r][c] || '';
                    const td = document.createElement('td'); td.id = `cell-${r}-${c}`; td.innerText = text; tr.appendChild(td);
                    const input = document.createElement('input'); input.type = 'text'; input.className = 'setting-grid-input'; input.value = text;
                    input.oninput = function() {
                        timetableData[r][c] = this.value;
                        localStorage.setItem('ocean_timetable_data', JSON.stringify(timetableData));
                        document.getElementById(`cell-${r}-${c}`).innerText = this.value;
                    };
                    rowDiv.appendChild(input);
                }
                tableBody.appendChild(tr); editorBox.appendChild(rowDiv);
            }
        }

        // --- 単語帳システム ---
        const defaultWords = [{ id: 1, en: "Coral", ja: "珊瑚（サンゴ）" }, { id: 2, en: "Current", ja: "海流" }];
        let words = localStorage.getItem('ocean_words_list') ? JSON.parse(localStorage.getItem('ocean_words_list')) : defaultWords;
        let globalVisibilityMode = 'hide-ja'; 
        renderWordList();

        function renderWordList() {
            const container = document.getElementById('word-list-container'); container.innerHTML = '';
            if (words.length === 0) { container.innerHTML = `<div style="text-align:center; font-size:0.85rem; opacity:0.6; padding:20px;">単語が登録されていません。</div>`; return; }
            words.forEach(w => {
                const card = document.createElement('div'); card.className = 'card'; card.style.display = 'flex'; card.style.justifyContent = 'flex-start'; card.style.alignItems = 'center'; card.style.padding = '18px 20px';
                const enSpan = document.createElement('span'); enSpan.innerText = w.en; enSpan.style.width = '120px'; enSpan.style.flexShrink = '0';
                if (globalVisibilityMode === 'hide-en') { enSpan.className = 'blur-text'; enSpan.onclick = function() { this.classList.toggle('reveal'); }; }
                const jaSpan = document.createElement('span'); jaSpan.innerText = w.ja;
                if (globalVisibilityMode === 'hide-ja') { jaSpan.className = 'blur-text'; jaSpan.onclick = function() { this.classList.toggle('reveal'); }; }
                
                const deleteBtn = document.createElement('span'); deleteBtn.innerHTML = '✕'; deleteBtn.style.color = 'rgba(255,255,255,0.4)'; deleteBtn.style.cursor = 'pointer'; deleteBtn.style.fontSize = '1.2rem'; deleteBtn.style.fontWeight = 'bold'; deleteBtn.style.padding = '10px 15px'; deleteBtn.style.marginRight = '-10px'; deleteBtn.style.transition = 'opacity 0.1s';
                deleteBtn.addEventListener('touchstart', () => deleteBtn.style.opacity = '0.5'); deleteBtn.addEventListener('touchend', () => deleteBtn.style.opacity = '1');
                deleteBtn.onclick = function(e) { e.stopPropagation(); words = words.filter(item => item.id !== w.id); localStorage.setItem('ocean_words_list', JSON.stringify(words)); renderWordList(); };
                
                const rightWrapper = document.createElement('div'); rightWrapper.style.flex = '1'; rightWrapper.style.display = 'flex'; rightWrapper.style.justifyContent = 'space-between'; rightWrapper.style.alignItems = 'center';
                rightWrapper.appendChild(jaSpan); rightWrapper.appendChild(deleteBtn);
                card.appendChild(enSpan); card.appendChild(rightWrapper); container.appendChild(card);
            });
        }

        function addNewWord() {
            const enInput = document.getElementById('input-en'); const jaInput = document.getElementById('input-ja');
            const enVal = enInput.value.trim(); const jaVal = jaInput.value.trim();
            if (!enVal || !jaVal) { alert("英語と日本語訳の両方を入力してください。"); return; }
            words.unshift({ id: Date.now(), en: enVal, ja: jaVal }); localStorage.setItem('ocean_words_list', JSON.stringify(words));
            enInput.value = ''; jaInput.value = ''; document.getElementById('ai-status-tips').style.display = 'none';
            renderWordList();
        }

        function setGlobalVisibility(mode) { globalVisibilityMode = mode; renderWordList(); }

        // AI翻訳
        async function askVercelAiTranslate() {
            const enVal = document.getElementById('input-en').value.trim(); const jaInput = document.getElementById('input-ja'); const tips = document.getElementById('ai-status-tips');
            if (!enVal) { alert("英語を入力してください。"); return; }
            tips.innerText = "🐋 VercelのServerless Functionを探索中..."; tips.style.display = "block";
            try {
                const response = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: enVal }) });
                if (!response.ok) throw new Error(`API Server Error: ${response.status}`);
                const data = await response.json();
                if (data && data.reply) { jaInput.value = data.reply.trim(); tips.innerText = "✨ Gemma-7b AIによる翻訳に成功！"; }
            } catch (error) { console.error(error); tips.innerText = "❌ 通信エラー。"; }
        }
    </script>
</body>
