<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCEAN COMPASS</title>
    <style>
        /* --- 全体のスタイル（サイバー深海デザイン） --- */
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* 🎨 写真に合わせた美しい水中ディープブルーグラデーション */
            background: linear-gradient(180deg, #0d1b2a 0%, #0b2545 40%, #134074 100%);
            min-height: 100vh; color: #ffffff;
            box-sizing: border-box; padding-bottom: 110px;
            transition: background 1.5s ease-out;
            overflow-x: hidden;
        }
        input:focus, select:focus, textarea:focus { outline: none; }
        
        /* --- サイバーネオン・グラスモーフィズム --- */
        .card {
            background: rgba(11, 37, 69, 0.4);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 12px 40px 0 rgba(0, 229, 255, 0.15);
            border: 1px solid rgba(0, 229, 255, 0.2);
        }
        
        /* 📱 フローティング・ボトムナビゲーションバー */
        .bottom-nav {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%); width: 90%; max-width: 450px;
            height: 72px; background: rgba(13, 27, 42, 0.6);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-radius: 36px; display: flex; justify-content: space-around;
            align-items: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08); z-index: 999;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: rgba(255, 255, 255, 0.4); font-size: 0.7rem; font-weight: 600;
            cursor: pointer; text-decoration: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; width: 60px;
        }
        .nav-item svg {
            width: 24px; height: 24px; fill: currentColor; margin-bottom: 4px;
            transition: transform 0.3s ease;
        }
        .nav-item.active { color: #00e5ff; }
        .nav-item.active svg { transform: translateY(-4px); }
        .nav-item.active::after {
            content: ''; position: absolute; bottom: -8px; width: 6px; height: 6px;
            background: #00e5ff; border-radius: 50%; box-shadow: 0 0 10px #00e5ff;
        }

        /* 📦 メイン画面・タブ切り替え用の構造 */
        .container { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
        .app-view { display: none; animation: fadeIn 0.4s ease-out forwards; }
        .app-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ⏰ タイマー表示 */
        .timer-display {
            font-size: 4.5rem; font-weight: 800; text-align: center;
            font-family: monospace; letter-spacing: -2px; margin: 20px 0;
            background: linear-gradient(135deg, #ffffff 0%, #00e5ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
        }

        /* 🔮 サイバーボタン */
        .btn-cyber {
            width: 100%; background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
            border: none; border-radius: 16px; color: white; padding: 16px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 119, 182, 0.4); transition: all 0.2s;
        }
        .btn-cyber:active { transform: scale(0.98); }

        /* 🖊️ 単語帳入力欄 */
        .input-cyber {
            width: 100%; background: rgba(13, 27, 42, 0.6); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 12px 16px; color: white; font-size: 1rem;
            box-sizing: border-box; transition: all 0.3s;
        }
        .input-cyber:focus { border-color: #00e5ff; box-shadow: 0 0 10px rgba(0,229,255,0.2); }

        /* 🌌 特殊エフェクト */
        .blur-text { filter: blur(4px); transition: filter 0.3s; }
        .blur-text:hover { filter: blur(0); }
        .ai-loading-pulse { animation: aiPulse 1.5s infinite ease-in-out; }
        @keyframes aiPulse { 0% { opacity: 0.6; } 50% { opacity: 1; color: #00e5ff; } 100% { opacity: 0.6; } }

        /* 🤖 AIモーダルウィンドウ（常設エリアへの切り替えに伴い、古いポップアップ用スタイルは不要になりました） */
    </style>
</head>
<body>

    <div class="container">
        <div id="view-home" class="app-view active">
            <h2 style="text-align: center; margin-bottom: 24px; color: #00e5ff; font-weight: 700;">OCEAN COMPASS</h2>
            
            <div class="card" style="text-align: center; padding: 32px 24px; margin-bottom: 20px;">
                <span id="diver-badge" style="background: rgba(0, 229, 255, 0.15); color: #00e5ff; padding: 6px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; border: 1px solid rgba(0, 229, 255, 0.3);">
                    ⚓ DEEP SEA DIVER
                </span>
                
                <div class="timer-display" id="timer-text">25:00</div>
                
                <div style="display: flex; gap: 12px;">
                    <button class="btn-cyber" id="start-btn" onclick="toggleTimer()" style="flex: 2;">潜水開始 🧭</button>
                    <button onclick="resetTimer()" style="flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; color: white; cursor: pointer; font-weight: bold;">帰還 ⚓</button>
                </div>
            </div>

            <div class="card" style="padding: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 style="color: #00e5ff; margin: 0; font-size: 1.1rem;">⚓ キャプテンの航海日誌</h3>
                    <button id="btn-ai-review" onclick="generateAiReview()" style="padding: 6px 12px; background: rgba(0, 229, 255, 0.1); border: 1px solid #00e5ff; color: #00e5ff; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold;">
                        ログを手動更新 🧠
                    </button>
                </div>
                <div id="ai-response-box" style="color: #ffffff; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6; background: rgba(13, 27, 42, 0.4); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                    現在の潜水セッションのデータは未送信だ。タイマーを稼働させて深海へダイブせよ。
                </div>
            </div>
        </div>

        <div id="view-words" class="app-view">
            <h2 style="color: #00e5ff; margin-bottom: 20px;">深海単語アーカイブ</h2>
            
            <div class="card" style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px;">
                <input type="text" id="input-en" class="input-cyber" placeholder="English Word (e.g. abyss)">
                
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="text" id="input-ja" class="input-cyber" placeholder="日本語の訳" style="flex: 1;">
                    <button id="btn-ai-translate" onclick="askVercelCloudflareAiTranslate()" style="padding: 12px; background: rgba(0,229,255,0.15); border: 1px solid #00e5ff; color: #00e5ff; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 0.9rem; white-space: nowrap;">
                        AI翻訳 🧠
                    </button>
                </div>
                
                <button class="btn-cyber" onclick="addNewWord()" style="padding: 12px; font-size: 1rem;">アーカイブに記録 💾</button>
            </div>

            <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                <button onclick="setGlobalVisibility('show-all')" style="flex:1; padding:8px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:white; cursor:pointer; font-size:0.8rem;">すべて表示</button>
                <button onclick="setGlobalVisibility('hide-en')" style="flex:1; padding:8px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:white; cursor:pointer; font-size:0.8rem;">英語を隠す</button>
                <button onclick="setGlobalVisibility('hide-ja')" style="flex:1; padding:8px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:white; cursor:pointer; font-size:0.8rem;">日本語を隠す</button>
            </div>

            <div id="words-list-container" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>

        <div id="view-missions" class="app-view">
            <h2 style="color: #00e5ff; margin-bottom: 20px;">潜水ミッション（ToDo）</h2>
            <div class="card" style="margin-bottom: 20px; display: flex; gap: 8px;">
                <input type="text" id="todo-input" class="input-cyber" placeholder="新しいミッションを追加..." style="flex: 1;">
                <button onclick="addTodo()" style="padding: 0 20px; background: #00e5ff; border: none; border-radius: 12px; color: #0d1b2a; font-weight: bold; cursor: pointer;">追加</button>
            </div>
            <div id="todo-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="switchView('home')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            潜水艦
        </div>
        <div class="nav-item" id="nav-words" onclick="switchView('words')">
            <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
            単語帳
        </div>
        <div class="nav-item" id="nav-missions" onclick="switchView('missions')">
            <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            任務
        </div>
    </nav>

    <script>
        // ==========================================
        // 📡 Vercel上の 各種AIエンドポイント設定
        // ==========================================
        const VERCEL_CHAT_API_URL = "/api/chat";
        const VERCEL_REVIEW_API_URL = "/api/review"; // 👈 エラー回避のため確実に定義！

        // --- アプリの状態管理 ---
        let currentDiverName = "TAKUYA";
        let timerInterval = null;
        let isTimerRunning = false;
        let totalSeconds = 25 * 60;
        let initialSeconds = 25 * 60;
        let globalVisibilityMode = "show-all";
        
        // 🚨 【新設】潜水中に別のタブに逃げた回数を追跡
        let appDistractionCount = 0;

        // 📡 別タブへの離脱を自動カウント
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isTimerRunning) {
                appDistractionCount++;
                console.log(`🚨 カウントアップ: サボり回数 = ${appDistractionCount}`);
            }
        });

        // データのローカルストレージ管理
        let timeLogs = JSON.parse(localStorage.getItem('ocean_time_logs')) || {};
        let words = JSON.parse(localStorage.getItem('ocean_words_list')) || [];
        let todos = JSON.parse(localStorage.getItem('ocean_todo_list')) || [
            { id: 1, text: "今日の目標単語を3つ覚える", completed: false },
            { id: 2, text: "25分間ディープダイブ（集中）する", completed: false }
        ];

        window.onload = function() {
            renderWordList();
            renderTodoList();
        };

        function switchView(viewId) {
            document.querySelectorAll('.app-view').forEach(view => view.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
            document.getElementById(`nav-${viewId}`).classList.add('active');
        }

        // ==========================================
        // ⏰ タイマー制御ロジック
        // ==========================================
        function updateTimerDisplay() {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            document.getElementById('timer-text').innerText = 
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (isTimerRunning) {
                // 手動で潜水停止ボタンを押した瞬間
                isTimerRunning = false;
                clearInterval(timerInterval);
                document.getElementById('start-btn').innerText = '潜水開始 🧭';
                document.getElementById('start-btn').style.background = 'linear-gradient(135deg, #00b4d8 0%, #0077b6 100%)';
                
                // 🚀 【自動送信】手動で切り上げたときも、裏で自動解析！
                generateAiReview();
            } else {
                isTimerRunning = true;
                document.getElementById('start-btn').innerText = '潜水停止 🛑';
                document.getElementById('start-btn').style.background = 'linear-gradient(135deg, #e63946 0%, #d62828 100%)';
                
                timerInterval = setInterval(() => {
                    if (totalSeconds > 0) {
                        totalSeconds--;
                        updateTimerDisplay();
                    } else {
                        // 00:00 まで完遂して自動終了した瞬間
                        isTimerRunning = false;
                        clearInterval(timerInterval);
                        document.getElementById('start-btn').innerText = '潜水開始 🧭';
                        document.getElementById('start-btn').style.background = 'linear-gradient(135deg, #00b4d8 0%, #0077b6 100%)';
                        
                        const dMins = Math.floor(initialSeconds / 60);
                        saveDiveLog(dMins);
                        
                        // 🚀 【自動送信】完遂したときも、即座に裏で自動解析！
                        generateAiReview();
                        alert("🧭 タイムアップ！無事深海から帰還したぞ！");
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            isTimerRunning = false;
            clearInterval(timerInterval);
            totalSeconds = 25 * 60;
            updateTimerDisplay();
            document.getElementById('start-btn').innerText = '潜水開始 🧭';
            document.getElementById('start-btn').style.background = 'linear-gradient(135deg, #00b4d8 0%, #0077b6 100%)';
        }

        function saveDiveLog(mins) {
            const today = getTodayString();
            timeLogs[today] = (timeLogs[today] || 0) + mins;
            localStorage.setItem('ocean_time_logs', JSON.stringify(timeLogs));
        }

        function getTodayString() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        // ==========================================
        // 🧠 バックグラウンド自動AI振り返りロジック
        // ==========================================
        async function generateAiReview() {
            const responseBox = document.getElementById('ai-response-box');
            const btn = document.getElementById('btn-ai-review');
            if (!responseBox) return;
            
            // 🔄 ポップアップ画面ロックは完全撤廃
            if (btn) {
                btn.innerText = "解析中...";
                btn.disabled = true;
            }
            responseBox.innerHTML = "<span style='color: #00e5ff; font-weight: bold;'>🧭 本日のログデータを深海サーバーへ自動アップロード中...<br>キャプテンAIがログを解析しています...</span>";
            
            const todayStr = getTodayString();
            const todayMins = timeLogs[todayStr] || 0;
            const unfinishedTodosCount = todos.filter(t => !t.completed).length;

            try {
                const response = await fetch(VERCEL_REVIEW_API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        minutes: todayMins, 
                        todosCount: unfinishedTodosCount,
                        diverName: currentDiverName,
                        distractionCount: appDistractionCount // 👈 溜まったサボり回数を自動で送信！
                    })
                });

                const data = await response.json();

                if (response.ok && data.reply) {
                    // 🎉 届いたメッセージを常設ボックスに表示！
                    responseBox.innerText = data.reply;
                } else {
                    responseBox.innerText = `🚨 ログ解析エラー\n${data.reply || 'キャプテンとの通信に障害が発生したようだ。'}`;
                }
            } catch (error) {
                console.error("振り返りAPI接続エラー:", error);
                responseBox.innerText = `🚨 接続失敗\n深海通信プロトコルに失敗した。Vercelへのデプロイ状態やURL変数を確認してくれ！`;
            } finally {
                if (btn) {
                    btn.innerText = "ログを手動更新 🧠";
                    btn.disabled = false;
                }
            }
        }

        // ==========================================
        // 📝 AI翻訳 ＆ 単語帳管理
        // ==========================================
        async function askVercelCloudflareAiTranslate() {
            const enInput = document.getElementById('input-en').value.trim();
            const jaInputField = document.getElementById('input-ja');
            const btn = document.getElementById('btn-ai-translate');
            
            if (!enInput) { alert("英語を入力してください！"); return; }
            
            btn.innerText = "思考中...🧠";
            btn.classList.add('ai-loading-pulse');
            
            try {
                const response = await fetch(VERCEL_CHAT_API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: enInput })
                });
                
                const data = await response.json();
                
                if (response.ok && data.reply) {
                    jaInputField.value = data.reply.trim();
                } else {
                    alert(`APIエラー: ${data.reply || '翻訳に失敗しました'}`);
                }
            } catch (error) {
                console.error("Vercel AI 接続エラー:", error);
                alert("サーバーへの接続に失敗したぜ。URLの設定を確認してくれ！");
            } finally {
                btn.innerText = "AI翻訳 🧠";
                btn.classList.remove('ai-loading-pulse');
            }
        }

        function renderWordList() {
            const container = document.getElementById('words-list-container');
            if(!container) return;
            container.innerHTML = '';
            
            words.forEach(w => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.display = 'flex'; card.style.justifyContent = 'space-between'; card.style.alignItems = 'center';
                
                const enSpan = document.createElement('span'); enSpan.innerText = w.en; if (globalVisibilityMode === 'hide-en') { enSpan.className = 'blur-text'; enSpan.onclick = function() { this.classList.toggle('reveal'); }; }
                const jaSpan = document.createElement('span'); jaSpan.innerText = w.ja; if (globalVisibilityMode === 'hide-ja') { jaSpan.className = 'blur-text'; jaSpan.onclick = function() { this.classList.toggle('reveal'); }; }
                
                const del = document.createElement('span'); del.innerHTML = '✕'; del.style.cursor='pointer'; del.style.color = 'rgba(255,255,255,0.3)';
                del.onclick = function() { 
                    words = words.filter(item => item.id !== w.id); 
                    localStorage.setItem('ocean_words_list', JSON.stringify(words)); 
                    renderWordList(); 
                };
                
                card.appendChild(enSpan); card.appendChild(jaSpan); card.appendChild(del); container.appendChild(card);
            });
        }

        function addNewWord() {
            const en = document.getElementById('input-en'); const ja = document.getElementById('input-ja'); if(!en.value||!ja.value) return;
            words.unshift({ id: Date.now(), en: en.value.trim(), ja: ja.value.trim() }); localStorage.setItem('ocean_words_list', JSON.stringify(words)); en.value = ''; ja.value = ''; renderWordList();
        }

        function setGlobalVisibility(mode) { globalVisibilityMode = mode; renderWordList(); }

        // ==========================================
        // 🎯 ミッション（ToDo）管理
        // ==========================================
        function renderTodoList() {
            const container = document.getElementById('todo-list');
            if(!container) return;
            container.innerHTML = '';
            
            todos.forEach(t => {
                const item = document.createElement('div');
                item.className = 'card';
                item.style.display = 'flex'; item.style.alignItems = 'center'; item.style.justifyContent = 'space-between';
                if(t.completed) item.style.opacity = '0.5';
                
                const leftSide = document.createElement('div');
                leftSide.style.display = 'flex'; leftSide.style.alignItems = 'center'; leftSide.style.gap = '12px';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox'; checkbox.checked = t.completed;
                checkbox.onclick = function() {
                    t.completed = !t.completed;
                    localStorage.setItem('ocean_todo_list', JSON.stringify(todos));
                    renderTodoList();
                };
                
                const textSpan = document.createElement('span');
                textSpan.innerText = t.text;
                if(t.completed) textSpan.style.textDecoration = 'line-through';
                
                leftSide.appendChild(checkbox); leftSide.appendChild(textSpan);
                
                const del = document.createElement('span');
                del.innerHTML = '✕'; del.style.cursor = 'pointer'; del.style.color = 'rgba(255,255,255,0.3)';
                del.onclick = function() {
                    todos = todos.filter(item => item.id !== t.id);
                    localStorage.setItem('ocean_todo_list', JSON.stringify(todos));
                    renderTodoList();
                };
                
                item.appendChild(leftSide); item.appendChild(del);
                container.appendChild(item);
            });
        }

        function addTodo() {
            const input = document.getElementById('todo-input');
            if(!input.value.trim()) return;
            todos.push({ id: Date.now(), text: input.value.trim(), completed: false });
            localStorage.setItem('ocean_todo_list', JSON.stringify(todos));
            input.value = '';
            renderTodoList();
        }
    </script>
</body>
</html>
